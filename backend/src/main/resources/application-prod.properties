# Server Configuration
server.port=${PORT:8082}

# Database Configuration (via Environment Variables)
# Ejemplo DB_URL para PostgreSQL: jdbc:postgresql://host:port/database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration for Production
# 'update' creará/actualizará tablas sin borrar datos.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.jpa.defer-datasource-initialization=true

# Security - JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:hotelflow}
security.jwt.expirationMinutes=${JWT_EXPIRATION_MINUTES:1440}

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Application Configuration
app.frontend.url=${APP_FRONTEND_URL}
app.notifications.ownerEmail=${NOTIFICATIONS_OWNER_EMAIL}

management.endpoints.web.exposure.include=health,info
