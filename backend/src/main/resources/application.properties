spring.application.name=hotel-booking-api

# Server Configuration
server.port=8082

# Database Configuration (H2 in-memory for development)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console (for development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Logging
logging.level.com.digitalhouse=DEBUG
logging.level.org.springframework.web=DEBUG

# Security - JWT
security.jwt.secret=dev-secret-change-me
security.jwt.issuer=hotelflow
security.jwt.expirationMinutes=60

# Email Configuration (Gmail SMTP for development)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Application Configuration
app.frontend.url=http://localhost:5173
app.notifications.ownerEmail=${NOTIFICATIONS_OWNER_EMAIL:}
