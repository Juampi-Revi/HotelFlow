<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with glassmorphism effect -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6" />
      <stop offset="100%" style="stop-color:#6366f1" />
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1"/>
    </filter>
  </defs>
  
  <!-- Background rounded rectangle -->
  <rect x="2" y="2" width="196" height="56" rx="12" fill="url(#bgGradient)" stroke="rgba(59, 130, 246, 0.2)" stroke-width="1"/>
  
  <!-- Hotel icon with flow effect -->
  <g transform="translate(12, 12)">
    <!-- Building base -->
    <rect x="2" y="20" width="24" height="16" rx="2" fill="url(#iconGradient)" opacity="0.9"/>
    
    <!-- Building floors -->
    <rect x="4" y="22" width="4" height="3" rx="1" fill="white" opacity="0.8"/>
    <rect x="10" y="22" width="4" height="3" rx="1" fill="white" opacity="0.8"/>
    <rect x="16" y="22" width="4" height="3" rx="1" fill="white" opacity="0.8"/>
    <rect x="22" y="22" width="4" height="3" rx="1" fill="white" opacity="0.8"/>
    
    <rect x="4" y="27" width="4" height="3" rx="1" fill="white" opacity="0.8"/>
    <rect x="10" y="27" width="4" height="3" rx="1" fill="white" opacity="0.8"/>
    <rect x="16" y="27" width="4" height="3" rx="1" fill="white" opacity="0.8"/>
    <rect x="22" y="27" width="4" height="3" rx="1" fill="white" opacity="0.8"/>
    
    <rect x="4" y="32" width="4" height="3" rx="1" fill="white" opacity="0.8"/>
    <rect x="10" y="32" width="4" height="3" rx="1" fill="white" opacity="0.8"/>
    <rect x="16" y="32" width="4" height="3" rx="1" fill="white" opacity="0.8"/>
    <rect x="22" y="32" width="4" height="3" rx="1" fill="white" opacity="0.8"/>
    
    <!-- Flow waves -->
    <path d="M30 18 Q35 15 40 18 T50 18" stroke="url(#iconGradient)" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M30 24 Q35 21 40 24 T50 24" stroke="url(#iconGradient)" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M30 30 Q35 27 40 30 T50 30" stroke="url(#iconGradient)" stroke-width="2" fill="none" opacity="0.3"/>
  </g>
  
  <!-- Text "HotelFlow" -->
  <text x="70" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Hotel</text>
  <text x="70" y="42" font-family="Arial, sans-serif" font-size="16" font-weight="300" fill="url(#iconGradient)">Flow</text>
  
  <!-- Tagline -->
  <text x="70" y="52" font-family="Arial, sans-serif" font-size="8" fill="#6b7280" opacity="0.8">Seamless stays, endless possibilities</text>
</svg>